[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-eval-harness"
version = "0.1.0"
description = "Production-grade LLM Red-Team & Prompt-Injection Evaluation Harness with modular attack suites, LLM-as-a-Judge rubric scoring, offline deterministic simulation, FastAPI service, and CLI runner."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nitesh M" },
]
keywords = [
    "llm-security",
    "red-teaming",
    "prompt-injection",
    "jailbreak",
    "pii-leakage",
    "ai-safety",
    "evaluation-harness",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
redteam = "redteam_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S105", "S106"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/redteam_harness/attacks/**" = ["S105", "S106"]
"src/redteam_harness/judge/rubrics.py" = ["S106"]
"src/redteam_harness/targets/mock.py" = ["S105", "S106"]
"src/redteam_harness/config.py" = ["S105", "S106"]

[tool.coverage.run]
source = ["redteam_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
